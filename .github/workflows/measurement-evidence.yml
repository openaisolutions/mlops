name: Measurement evidence companion
on:
  push:
    branches: ["main"]
    paths: ["examples/software-measurement/**", ".github/workflows/measurement-evidence.yml"]
  pull_request:
    paths: ["examples/software-measurement/**", ".github/workflows/measurement-evidence.yml"]
  schedule:
    - cron: "41 10 * * 3"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teaching-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate measurement and collector controls
        run: python -m unittest discover -s examples/software-measurement -p 'test_*.py' -v
      - name: Reproduce synthetic engineering example
        run: python examples/software-measurement/measurement.py --input examples/software-measurement/example.json --output measurement-evidence/teaching
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-measurement-example
          path: measurement-evidence/teaching
          retention-days: 7
          if-no-files-found: error
  live-github-evidence:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Collect read-only pipeline evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MEASUREMENT_REPOSITORY: ${{ github.repository }}
        run: python examples/software-measurement/collect_github.py --repository "$MEASUREMENT_REPOSITORY" --output measurement-evidence/live/github-runs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-github-pipeline-evidence
          path: measurement-evidence/live
          retention-days: 7
          if-no-files-found: error

